<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZML — Les Héritiers (homepage mock)</title>
<style>
  :root { color-scheme: dark; --bg:#07080c; --ink:#f1ebdc; --soft:#8d8a92; --blue:#2f4bff; --red:#ee2a3a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--serif); }
  main { height:100vh; height:100dvh; display:grid; grid-template-columns:1fr auto 1fr; gap:clamp(16px,3vw,48px); padding:clamp(16px,2.5vw,32px); }
  .col { display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
  .right { align-items:flex-end; text-align:right; }
  #logo { display:block; width:200px; height:72px; cursor:pointer; image-rendering:pixelated; }
  .cap { font:11px/1.5 var(--mono); color:var(--soft); margin-top:6px; }
  .stage { height:100%; aspect-ratio:4/5; position:relative; }
  #view { width:100%; height:100%; display:block; background:#000; animation:decrunch 1.8s steps(36) both; }
  @keyframes decrunch { from { clip-path:inset(0 0 100% 0); } to { clip-path:inset(0 0 0 0); } }
  .who a { color:inherit; text-decoration:none; display:block; }
  .who h1 { font-weight:400; font-size:clamp(30px,4.2vw,64px); line-height:1; letter-spacing:-.015em; margin:0 0 10px; }
  .who a:hover h1 { text-decoration:underline; text-decoration-color:var(--red); text-underline-offset:6px; text-decoration-thickness:3px; }
  .years { font:13px var(--mono); color:var(--red); }
  .blurb { font-size:clamp(15px,1.5vw,20px); color:#cfc9ba; max-width:30ch; margin:10px 0 0; }
  .go { font:12px var(--mono); color:var(--soft); margin-top:12px; display:block; }
  .day { font:12px var(--mono); color:var(--soft); }
  .day b { color:var(--ink); font-weight:600; }
  #ticks { display:grid; grid-template-columns:repeat(30,1fr); gap:3px; width:min(240px,100%); margin-top:8px; }
  #ticks i { height:6px; background:rgba(241,235,220,.14); }
  #ticks i.done { background:var(--ink); } #ticks i.now { background:var(--red); }
  nav { display:flex; gap:18px; font:13px var(--mono); }
  nav a { color:var(--ink); text-decoration:none; border-bottom:1px solid rgba(241,235,220,.35); padding-bottom:2px; }
  nav a:hover { border-color:var(--red); color:var(--red); }
  #dev { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); font:11px var(--mono); color:var(--soft); background:rgba(7,8,12,.85); padding:6px 10px; border:1px solid rgba(241,235,220,.15); border-radius:6px; }
  @media (max-width:820px) {
    main { display:block; position:relative; padding:0; }
    .stage { position:absolute; inset:0; aspect-ratio:auto; }
    #view { object-fit:cover; }
    .col { position:absolute; left:0; right:0; padding:16px; z-index:2; pointer-events:none; }
    .col * { pointer-events:auto; }
    .left { top:0; bottom:0; justify-content:flex-end; background:linear-gradient(transparent 45%,rgba(7,8,12,.92)); }
    .left > :first-child { position:absolute; top:16px; left:16px; }
    .right { top:0; height:auto; flex-direction:row; justify-content:space-between; align-items:flex-start; left:auto; right:0; width:auto; }
    .right .day { display:none; } #ticks { display:none; }
    .right nav { position:fixed; right:16px; top:16px; flex-direction:column; align-items:flex-end; gap:8px; }
    #logo { width:150px; height:54px; }
    #shcap, #logocap { display:none; }
  }
</style>
</head>
<body>
<main>
  <div class="col left">
    <div><canvas id="logo" width="200" height="72" title="Click: re-roll the logo"></canvas><div class="cap" id="logocap"></div></div>
    <div class="who" id="who"></div>
  </div>
  <div class="stage"><canvas id="view" width="640" height="800" aria-label="Portrait"></canvas></div>
  <div class="col right">
    <nav><a href="#" onclick="return false">GitHub</a><a href="#" onclick="return false">Docs</a></nav>
    <div>
      <div class="day" id="day"></div><div id="ticks"></div>
      <div class="cap" id="shcap" style="margin-top:14px"></div>
    </div>
  </div>
</main>
<div id="dev" hidden>← → change day · [ ] change shader · L re-roll logo · D hide</div>
<script>
"use strict";
const PEOPLE = [
  { wiki: null, name: "Joseph Marie Jacquard", years: "1752–1834", blurb: "Invented the programmable punch-card loom.", skin: "#d8b698", hair: "wig", coat: "#3a4a7a", cravat: true },
  { wiki: null, name: "Sophie Germain", years: "1776–1831", blurb: "Foundational work on elasticity theory; wrote as “Monsieur Le Blanc”.", skin: "#e0c3a8", hair: "bun", hairCol: "#2a1f1a", coat: "#7a2f3a", lace: true, female: true },
  { wiki: null, name: "Émile Baudot", years: "1845–1903", blurb: "Invented the 5-bit Baudot code, ancestor of ASCII.", skin: "#d2ae90", hair: "short", hairCol: "#3a2c24", stache: true, coat: "#242a3a", cravat: true },
  { wiki: null, name: "Marcel Boiteux", years: "1922–2023", blurb: "Architect of France's nuclear programme.", skin: "#dbb99c", hair: "bald", hairCol: "#d8d6d0", glasses: true, coat: "#2c3342", cravat: true },
  { wiki: null, name: "Jean-Louis Gassée", years: "b. 1944", blurb: "Apple, Be Inc.", skin: "#dcbb9f", hair: "short", hairCol: "#cfcdc8", glasses: true, coat: "#1d1f26" },
  { wiki: null, name: "Jean-Baptiste Kempf", years: "b. 1983", blurb: "VLC media player.", skin: "#d9b497", hair: "long", hairCol: "#2b2019", beard: true, coat: "#3a3f4a" },
];

const SRC_W = 640, SRC_H = 800;
const srcCanvas = document.createElement("canvas");
srcCanvas.width = SRC_W; srcCanvas.height = SRC_H;
const sctx = srcCanvas.getContext("2d");

function ell(c, x, y, rx, ry, fill) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); }

function drawPortrait(p) {
  const c = sctx, W = SRC_W, H = SRC_H, cx = W / 2;
  let g = c.createRadialGradient(cx, 330, 40, cx, 380, 560);
  g.addColorStop(0, "#8b8f9c"); g.addColorStop(1, "#171922");
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // shoulders
  g = c.createLinearGradient(0, 600, 0, H);
  g.addColorStop(0, p.coat); g.addColorStop(1, "#0c0d12");
  c.beginPath(); c.ellipse(cx, 840, 330, 250, 0, 0, Math.PI * 2); c.fillStyle = g; c.fill();
  // neck
  ell(c, cx, 585, 56, 90, shade(p.skin, -0.18));
  if (p.cravat) { c.beginPath(); c.moveTo(cx - 70, 600); c.lineTo(cx + 70, 600); c.lineTo(cx + 40, 740); c.lineTo(cx - 40, 740); c.closePath(); c.fillStyle = "#e9e5da"; c.fill(); }
  if (p.lace) { for (let i = 0; i < 14; i++) ell(c, cx - 78 + i * 12, 620 + Math.abs(i - 6.5) * 4, 11, 11, "#ece6da"); }

  // back hair
  const hc = p.hairCol || "#e7e5df";
  if (p.hair === "wig") { ell(c, cx, 390, 158, 190, hc); ell(c, 180, 480, 42, 52, hc); ell(c, 460, 480, 42, 52, hc); ell(c, 160, 560, 34, 40, hc); ell(c, 480, 560, 34, 40, hc); }
  if (p.hair === "bun") { ell(c, cx, 410, 140, 180, hc); ell(c, cx, 190, 58, 52, hc); }
  if (p.hair === "long") { ell(c, cx, 480, 150, 245, hc); }

  // ears + head
  ell(c, cx - 118, 420, 18, 34, shade(p.skin, -0.1)); ell(c, cx + 118, 420, 18, 34, shade(p.skin, -0.1));
  g = c.createRadialGradient(cx - 50, 340, 20, cx, 410, 190);
  g.addColorStop(0, shade(p.skin, 0.12)); g.addColorStop(0.7, p.skin); g.addColorStop(1, shade(p.skin, -0.32));
  c.beginPath(); c.ellipse(cx, 410, 120, 158, 0, 0, Math.PI * 2); c.fillStyle = g; c.fill();

  // hair on top
  if (p.hair === "wig") { ell(c, cx, 262, 126, 58, hc); ell(c, cx - 96, 330, 28, 60, hc); ell(c, cx + 96, 330, 28, 60, hc); }
  if (p.hair === "bun") { c.beginPath(); c.ellipse(cx, 280, 124, 78, 0, Math.PI, 0); c.fillStyle = hc; c.fill(); ell(c, cx - 70, 320, 30, 55, hc); ell(c, cx + 70, 320, 30, 55, hc); }
  if (p.hair === "short" || p.hair === "long") { c.beginPath(); c.ellipse(cx, 300, 124, 82, 0, Math.PI, 0); c.fillStyle = hc; c.fill(); }
  if (p.hair === "bald") { ell(c, cx - 122, 400, 12, 46, hc); ell(c, cx + 122, 400, 12, 46, hc); }

  // face features
  const eyeY = 400;
  for (const s of [-1, 1]) {
    ell(c, cx + s * 46, eyeY, 21, 10, "#f1ede4");
    ell(c, cx + s * 46, eyeY, 8.5, 8.5, "#2a2018");
    c.strokeStyle = shade(p.hairCol || "#d8d6d0", -0.25); c.lineWidth = p.female ? 4 : 8; c.lineCap = "round";
    c.beginPath(); c.moveTo(cx + s * 24, eyeY - 28); c.quadraticCurveTo(cx + s * 50, eyeY - 40, cx + s * 74, eyeY - 26); c.stroke();
  }
  // nose
  g = c.createLinearGradient(cx - 20, 0, cx + 30, 0);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(60,30,20,0.35)");
  c.beginPath(); c.moveTo(cx - 6, 400); c.lineTo(cx + 22, 478); c.quadraticCurveTo(cx, 492, cx - 22, 480); c.closePath(); c.fillStyle = g; c.fill();
  // mouth
  c.strokeStyle = "rgba(90,40,35,.85)"; c.lineWidth = 4; c.beginPath(); c.moveTo(cx - 34, 532); c.quadraticCurveTo(cx, 544, cx + 34, 532); c.stroke();
  if (p.stache) { c.beginPath(); c.moveTo(cx, 512); c.quadraticCurveTo(cx - 60, 500, cx - 84, 538); c.quadraticCurveTo(cx - 40, 524, cx, 528); c.quadraticCurveTo(cx + 40, 524, cx + 84, 538); c.quadraticCurveTo(cx + 60, 500, cx, 512); c.fillStyle = shade(p.hairCol, -0.1); c.fill(); }
  if (p.beard) { c.save(); c.beginPath(); c.ellipse(cx, 410, 120, 158, 0, 0, Math.PI * 2); c.clip(); c.beginPath(); c.ellipse(cx, 560, 130, 100, 0, 0, Math.PI * 2); c.fillStyle = p.hairCol; c.fill(); c.restore(); ell(c, cx, 524, 40, 11, "rgba(0,0,0,0)"); c.strokeStyle = "rgba(230,200,180,.8)"; c.lineWidth = 4; c.beginPath(); c.moveTo(cx - 28, 530); c.quadraticCurveTo(cx, 542, cx + 28, 530); c.stroke(); }
  if (p.glasses) { c.strokeStyle = "#15161b"; c.lineWidth = 6; for (const s of [-1, 1]) { c.beginPath(); c.ellipse(cx + s * 52, eyeY, 40, 31, 0, 0, Math.PI * 2); c.stroke(); } c.beginPath(); c.moveTo(cx - 12, eyeY - 4); c.lineTo(cx + 12, eyeY - 4); c.stroke(); }

  // key light falloff + grain
  g = c.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.55, "rgba(0,0,0,0.08)"); g.addColorStop(1, "rgba(0,0,0,0.5)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 5000; i++) { c.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; c.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

/* ---------- shaders ---------- */
const VERT = `attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const PRELUDE = `precision highp float;
uniform sampler2D uTex; uniform vec2 uRes; uniform float uTime, uP;
varying vec2 vUv;
const vec3 BLUE = vec3(0.10,0.18,0.80);
const vec3 IVORY = vec3(0.95,0.92,0.84);
const vec3 RED = vec3(0.93,0.16,0.22);
float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
vec3 T(vec2 uv){ return clamp(pow(texture2D(uTex, uv).rgb, vec3(0.62))*1.12, 0., 1.); }  // shared levels lift
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y*0.75))); }
float bayer4(vec2 a){ return bayer2(0.5*a)*0.25 + bayer2(a); }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
`;

const SHADERS = [
{ id: "jacquard", name: "Jacquard Loom", from: "Punch-card weaving, 1804", p: "hole density", d: 0.5, src: `
void main(){
  float cell = 6.0 + uP*14.0;
  vec2 px = vUv*uRes, c = floor(px/cell);
  float l = smoothstep(0.25,0.95,lum(T((c+0.5)*cell/uRes)));
  vec2 f = fract(px/cell) - 0.5;
  float size = pow(1.0-l, 0.8)*0.92;
  float hole = step(max(abs(f.x),abs(f.y)), size*0.5);
  vec3 card = vec3(0.89,0.77,0.52) * (0.92 + 0.08*hash(floor(px*0.5)));
  card *= 0.9 + 0.1*sin(px.x*0.6);               // warp threads
  vec3 col = mix(card, vec3(0.07,0.05,0.04), hole);
  float edge = step(max(abs(f.x),abs(f.y)), size*0.5+0.06) - hole;   // bevel
  col *= 1.0 - 0.35*edge*step(0.0, -f.x-f.y);
  gl_FragColor = vec4(col,1.);
}` },
{ id: "baudot", name: "Baudot Tape", from: "5-bit paper tape, 1870", p: "bit size", d: 0.45, src: `
void main(){
  float cell = 4.0 + uP*9.0;
  float h = cell*6.0;
  vec2 px = vUv*uRes;
  float b = floor(px.y/h);
  float ry = px.y - b*h;
  float r = floor(ry/cell);
  float col = floor(px.x/cell);
  float l = smoothstep(0.2,0.95,lum(T(vec2((col+0.5)*cell, (b+0.5)*h)/uRes)));
  float q = floor(clamp(l,0.,1.)*31.99);
  float k = r < 2.5 ? r : r-1.0;                 // row 2 is the sprocket
  float bit = mod(floor(q/exp2(k)), 2.0);
  vec2 f = fract(px/cell)-0.5;
  float d = length(f);
  bool sprocket = (r > 1.5 && r < 2.5);
  float hole = sprocket ? step(d,0.2) : step(d,0.37)*bit;
  vec3 paper = vec3(0.93,0.89,0.76) * (0.93+0.07*hash(floor(px)));
  float edge = smoothstep(0.0,3.0,ry)*smoothstep(0.0,3.0,h-ry);
  vec3 c3 = mix(paper*0.55, paper, edge);
  c3 = mix(c3, vec3(0.04,0.04,0.07), hole);
  gl_FragColor = vec4(c3,1.);
}` },
{ id: "bayer", name: "Bayer 1-bit", from: "Ordered dither, tricolore duotone", p: "pixel size", d: 0.4, src: `
void main(){
  float s = 1.0 + floor(uP*6.0);
  vec2 p = floor(vUv*uRes/s);
  float l = lum(T((p+0.5)*s/uRes));
  l = clamp((l-0.08)*1.25, 0., 1.);
  float on = step(bayer4(p)+0.03, l);
  gl_FragColor = vec4(mix(BLUE*0.55, IVORY, on), 1.);
}` },
{ id: "ascii", name: "ASCII Terminal", from: "Text-mode art, BBS era", p: "glyph size", d: 0.4, src: `
float seg(vec2 f, vec2 a, vec2 b, float w){
  vec2 pa=f-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
  return step(length(pa-ba*h), w);
}
void main(){
  vec2 cell = vec2(8.,14.)*(0.8+uP*1.6);
  vec2 px = vUv*uRes, c = floor(px/cell);
  vec3 s = T((c+0.5)*cell/uRes);
  float l = smoothstep(0.15,0.95,lum(s));
  float idx = floor(clamp(l*1.15,0.,0.999)*8.0);
  vec2 f = fract(px/cell);
  f.x = (f.x-0.5)*(cell.y/cell.x)*0.55 + 0.5;
  float m = 0.0;
  if (idx>0.5) m = step(length(f-vec2(0.5,0.78)),0.09);                       // .
  if (idx>1.5) m = max(m, step(length(f-vec2(0.5,0.35)),0.09));              // :
  if (idx>2.5) m = max(m, seg(f,vec2(0.3,0.5),vec2(0.7,0.5),0.05));          // -
  if (idx>3.5) m = max(m, seg(f,vec2(0.5,0.3),vec2(0.5,0.7),0.05));          // +
  if (idx>4.5) m = max(m, max(seg(f,vec2(0.3,0.3),vec2(0.7,0.7),0.05), seg(f,vec2(0.3,0.7),vec2(0.7,0.3),0.05)));
  if (idx>5.5) m = max(m, max(seg(f,vec2(0.35,0.2),vec2(0.35,0.8),0.05), seg(f,vec2(0.65,0.2),vec2(0.65,0.8),0.05)));
  if (idx>6.5) m = step(max(abs(f.x-0.5)*1.3,abs(f.y-0.5)),0.36);
  vec3 ink = mix(vec3(0.7,0.95,0.8), s*1.6, 0.4);
  gl_FragColor = vec4(vec3(0.02,0.03,0.05) + ink*m, 1.);
}` },
{ id: "ruttetra", name: "Rutt-Etra Scanlines", from: "Analog video synth, 1973", p: "line density", d: 0.45, src: `
void main(){
  float py = vUv.y*uRes.y;
  float sp = mix(14.,5.,uP), amp = sp*3.6;
  float acc = 0.0, tint = 0.0;
  for (int j=0;j<10;j++){
    float L = floor((py-amp)/sp) + float(j);
    float y0 = L*sp;
    float l = smoothstep(0.2,0.95,lum(T(vec2(vUv.x, clamp(y0/uRes.y,0.,1.)))));
    float d = abs(y0 + l*amp - py);
    float v = exp(-d*d*1.1)*(0.3+1.0*l);
    acc = max(acc, v); tint = max(tint, v*l);
  }
  vec3 col = mix(vec3(0.15,0.45,1.0), vec3(1.0,0.93,0.8), tint)*acc;
  gl_FragColor = vec4(vec3(0.01,0.02,0.05)+col, 1.);
}` },
{ id: "minitel", name: "Minitel", from: "Teletel semigraphics + CRT, 1982", p: "block size", d: 0.3, src: `
void main(){
  vec2 q = vUv-0.5;
  q *= 1.0 + dot(q,q)*0.22;
  vec2 uv = q*0.96 + 0.5;
  if (uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.){ gl_FragColor = vec4(0.,0.,0.,1.); return; }
  vec2 cell = vec2(8.,12.)*(1.0+uP*2.2);
  vec2 sub = cell/vec2(2.,3.);
  vec2 px = uv*uRes, sp = floor(px/sub);
  vec3 s = T((sp+0.5)*sub/uRes);
  float l = lum(s);
  float on = step(0.5 + (bayer4(sp)-0.5)*0.3, l*1.1);
  vec3 qc = step(0.42, s);
  if (dot(qc,vec3(1.))<1.0) qc = vec3(1.);
  vec2 g = fract(px/sub);
  float gap = smoothstep(0.0,0.14,g.x)*smoothstep(0.0,0.14,g.y);
  vec3 col = qc*on*gap;
  col += vec3(0.0,0.015,0.05);
  col *= 0.8 + 0.2*sin(vUv.y*uRes.y*3.14159);
  col *= 0.97 + 0.03*sin(uTime*55.);
  col *= 1.0 - 1.8*dot(q,q);
  gl_FragColor = vec4(col*1.15,1.);
}` },
{ id: "halftone", name: "Newsprint Halftone", from: "Offset printing, two-ink screen", p: "dot pitch", d: 0.45, src: `
float screen(vec2 px, float ang, float s, float cov, float lsrc){
  mat2 R = rot(ang);
  vec2 p = R*px/s;
  vec2 f = fract(p)-0.5;
  float r = length(f);
  float rad = sqrt(clamp(cov,0.,1.))*0.72;
  return 1.0 - smoothstep(rad-0.5/s-0.02, rad+0.5/s+0.02, r);
}
float cellLum(vec2 px, float ang, float s){
  mat2 R = rot(ang);
  vec2 c = (floor(R*px/s)+0.5)*s;
  return lum(T(clamp((c*R) / uRes, 0., 1.)));
}
void main(){
  vec2 px = vUv*uRes;
  float s = 5.0 + uP*11.0;
  float l1 = cellLum(px, 0.785, s);
  float l2 = cellLum(px, 0.26, s);
  float blue = screen(px, 0.785, s, 1.0-l1, l1);
  float red  = screen(px, 0.26, s, max(0.,(1.0-l2)-0.45)*1.8, l2);
  vec3 col = IVORY;
  col = mix(col, BLUE*0.8, blue*0.95);
  col = mix(col, RED, red*0.85) * mix(1., 0.82, red*blue);
  gl_FragColor = vec4(col,1.);
}` },
{ id: "engraving", name: "Gravure Hatching", from: "Copperplate engraving, Encyclopédie", p: "line pitch", d: 0.4, src: `
void main(){
  vec2 px = vUv*uRes, o = 1.5/uRes;

/* ---------- WebGL ---------- */
const glc = document.createElement("canvas");
const gl = glc.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
if (!gl) document.getElementById("app").insertAdjacentHTML("afterbegin", "<p class=fail>WebGL is not available in this browser.</p>");

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(frag) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return { p, u: { tex: gl.getUniformLocation(p, "uTex"), res: gl.getUniformLocation(p, "uRes"), time: gl.getUniformLocation(p, "uTime"), P: gl.getUniformLocation(p, "uP") } };
}
let tex;
if (gl) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
}
function uploadSource() {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
}

for (const s of SHADERS) {
  s.full = PRELUDE + s.src;
  s.value = s.d;
  try { s.prog = link(s.full); } catch (e) { s.error = String(e.message || e); console.error(s.id, s.error); }
}

function renderTo(shader, target, w, h, time) {
  if (shader.error) return;
  if (glc.width !== w || glc.height !== h) { glc.width = w; glc.height = h; }
  gl.viewport(0, 0, w, h);
  gl.useProgram(shader.prog.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(shader.prog.u.tex, 0);
  gl.uniform2f(shader.prog.u.res, w, h);
  gl.uniform1f(shader.prog.u.time, time);
  gl.uniform1f(shader.prog.u.P, shader.value);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const c = target.getContext("2d");
  c.drawImage(glc, 0, 0);
}


/* ---------- site ---------- */
const WIKI = ["Joseph_Marie_Jacquard","Sophie_Germain","Émile_Baudot","Marcel_Boiteux","Jean-Louis_Gassée","Jean-Baptiste_Kempf"];
const view = document.getElementById("view");
const qs = new URLSearchParams(location.search);
const startDay = Math.floor((Date.now() - Date.UTC(new Date().getUTCFullYear(), 0, 0)) / 864e5);
let dayIdx = qs.has("day") ? +qs.get("day") : startDay % 180;
let shaderOffset = qs.has("shader") ? +qs.get("shader") : 0;
function show() {
  const p = PEOPLE[dayIdx % PEOPLE.length];
  const sh = SHADERS[((dayIdx + shaderOffset) % SHADERS.length + SHADERS.length) % SHADERS.length];
  drawPortrait(p); uploadSource();
  document.getElementById("who").innerHTML =
    `<a href="https://en.wikipedia.org/wiki/${WIKI[dayIdx % PEOPLE.length]}" target="_blank" rel="noopener"><h1>${p.name}</h1>
     <div class="years">${p.years}</div><p class="blurb">${p.blurb}</p><span class="go">→ Wikipedia</span></a>`;
  document.getElementById("day").innerHTML = `Jour <b>${dayIdx + 1}</b> / 180`;
  const t = document.getElementById("ticks"); t.innerHTML = "";
  for (let i = 0; i < 180; i++) { const e = document.createElement("i"); if (i < dayIdx) e.className = "done"; if (i === dayIdx) e.className = "now"; t.append(e); }
  document.getElementById("shcap").textContent = `rendu · ${sh.name.toLowerCase()}`;
  current = sh;
  view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
}
let current;
function frame(now) {
  if (current && !current.error) { current.value = current.d; renderTo(current, view, 640, 800, now / 1000); }
  requestAnimationFrame(frame);
}

/* composable logo: Z M L stay fixed, everything else is re-rolled */
const logo = document.getElementById("logo"), lctx = logo.getContext("2d");
const mask = document.createElement("canvas"); mask.width = 200; mask.height = 72;
const mctx = mask.getContext("2d");
mctx.fillStyle = "#fff"; mctx.font = "900 64px ui-monospace, Menlo, Consolas, monospace"; mctx.textAlign = "left"; mctx.textBaseline = "middle";
mctx.fillText("ZML", 0, 40);
const maskData = mctx.getImageData(0, 0, 200, 72).data;
const inLetter = (x, y) => x >= 0 && y >= 0 && x < 200 && y < 72 && maskData[(y * 200 + x) * 4] > 128;
const STYLES = ["dots", "bars", "bayer", "bits", "weave"];
let style, backends, seed, t0 = performance.now();
function rollLogo() {
  style = STYLES[Math.floor(Math.random() * STYLES.length)];
  backends = 3 + Math.floor(Math.random() * 7);          // simulated "live" infra readout
  seed = Math.random() * 100;
  document.getElementById("logocap").textContent = `${backends} backends · ${style} · rendu #${Math.floor(seed * 997)}`;
}
function drawLogo(now) {
  const t = (now - t0) / 1000, c = lctx;
  c.clearRect(0, 0, 200, 72);
  const cell = 2 + (backends % 4);
  for (let y = 0; y < 72; y += cell) for (let x = 0; x < 200; x += cell) {
    const cx = x + cell / 2 | 0, cy = y + cell / 2 | 0;
    if (!inLetter(cx, cy)) continue;
    const gx = x / cell | 0, gy = y / cell | 0;
    if (style === "dots") { c.fillStyle = "#f1ebdc"; c.beginPath(); c.arc(cx, cy, cell * (.3 + .25 * Math.sin(t * 2 + gx * .4 + seed)), 0, 7); c.fill(); }
    else if (style === "bars") { c.fillStyle = gx % 2 ? "#ee2a3a" : "#f1ebdc"; c.fillRect(x, y, cell, cell * (.4 + .6 * Math.abs(Math.sin(t + gx * .3 + seed)))); }
    else if (style === "bayer") { const b = (((gx & 1) * 2 + (gy & 1) * 3 + ((gx >> 1) & 1) * 1 + ((gy >> 1) & 1) * 0) % 4) / 4; if (b < .5 + .45 * Math.sin(t + gy * .2)) { c.fillStyle = "#2f4bff"; c.fillRect(x, y, cell, cell); } else { c.fillStyle = "#f1ebdc"; c.fillRect(x, y, cell - 1, cell - 1); } }
    else if (style === "bits") { const on = ((gx * 7 + gy * 13 + Math.floor(t * 3 + seed)) % 3) === 0; c.fillStyle = on ? "#f1ebdc" : "#ee2a3a"; c.fillRect(x, y, cell - 1, cell - 1); c.fillStyle = "#07080c"; if (on) c.fillRect(x + 1, y + 1, 1, 1); }
    else { c.fillStyle = (gx + gy) % 2 ? "#f1ebdc" : "#2f4bff"; c.fillRect(x, y, cell, cell); }
  }
}
logo.addEventListener("click", rollLogo);
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { dayIdx = (dayIdx + 1) % 180; show(); }
  if (e.key === "ArrowLeft") { dayIdx = (dayIdx + 179) % 180; show(); }
  if (e.key === "]") { shaderOffset++; show(); }
  if (e.key === "[") { shaderOffset--; show(); }
  if (e.key === "l" || e.key === "L") rollLogo();
  if (e.key === "d" || e.key === "D") document.getElementById("dev").hidden = !document.getElementById("dev").hidden;
});
if (qs.has("dev")) document.getElementById("dev").hidden = false;
rollLogo(); show();
(function loop(now) { drawLogo(now); requestAnimationFrame(loop); })(performance.now());
requestAnimationFrame(frame);
</script>
